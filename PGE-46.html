    function updateUILanguage() {
        const t = translations[currentLanguage];

        if (detailedReview) detailedReview.innerText = t.detailedReview;
        const langBtn = document.getElementById('langToggleBtn');

        }
        if (quizActive && !isSubmitted && document.getElementById('navButtons')) {

    function toggleLanguage() {
        currentLanguage = currentLanguage === 'en' ? 'ta' : 'en';

            renderQuestion();
        }
        if (document.getElementById('resultContainer').style.display === 'block') {
            buildDetailedReview();
        }
        renderDashboard();
    }

    dashboard.totalMarks = QUESTIONS.length.toString();
    let GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbziC0ooBCFlAvfWit4lZsxFRVLnLKX56lNzW8cZmVvNiGR0A_EJG7VG8A9OgRtup88BoQ/exec";
    
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, function(m){ return m==='&'?'&amp;':m==='<'?'&lt;':'>'?'&gt;':m;}); }
    
    function renderDashboard() {
        const container = document.getElementById('dashboardContainer');
        if(container) {
            container.innerHTML = `<div class="institute-name">DR SAHITHA IAS ACADEMY</div>
                <div style="font-size:0.9rem;">(Since 2025)</div>
                <div style="margin:8px 0 0; font-size:1.5rem;font-weight:800;color:var(--accent);">📖 ${escapeHtml(dashboard.examTitle)}</div>
                <div>TEST.NO - ${escapeHtml(dashboard.testNo)}</div>
                <div>📅 DATE: ${escapeHtml(dashboard.date)}</div>
                <div>📖 SUBJECT: ${escapeHtml(dashboard.subject)}</div>
                <div>🎯 TOPIC: ${escapeHtml(dashboard.topic)}</div>
                <div>⏱️ DURATION: ${escapeHtml(dashboard.duration)} MIN</div>
                <div>🏆 TOTAL MARKS: ${dashboard.totalMarks}</div>`;
        }
        let totalSpan = document.getElementById('totalQsSpan');
        if(totalSpan) totalSpan.innerText = `/${dashboard.totalMarks}`;
    }
    
    function autoSaveState() {
        if (!quizActive || isSubmitted) return;
        const state = {
            candidateName: candidateName,
            userAnswers: userAnswers,
            currentIndex: currentIndex,
            timeLeft: timeLeft,
            startTimestamp: startTimestamp,
            isSubmitted: false,
            quizActive: true,
            savedAt: Date.now(),
            language: currentLanguage
        };
        localStorage.setItem('tetEnglishAutoResume', JSON.stringify(state));
    }
    
    function showResumePopup(savedState) {
        const answeredCount = savedState.userAnswers.filter(a => a !== null).length;
        const remaining = QUESTIONS.length - answeredCount;
        const t = translations[currentLanguage];
        const modalHtml = `
            <div id="resumeModal" class="modal-overlay">
                <div class="modal-container">
                    <h3>🔄 Unfinished Exam Found</h3>
                    <p>You have an incomplete exam.<br>
                    <strong>${answeredCount}</strong> questions answered, <strong>${remaining}</strong> remaining.<br>
                    Last saved: ${new Date(savedState.savedAt).toLocaleTimeString()}<br><br>
                    Do you want to continue where you left off?</p>
                    <div class="modal-buttons">
                        <button id="modalResumeBtn" class="btn">✅ Resume Exam</button>
                        <button id="modalNewBtn" class="btn btn-secondary">❌ Start New</button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        document.getElementById('modalResumeBtn').onclick = () => {
            document.getElementById('resumeModal').remove();
            autoResumeExam(savedState);
        };
        document.getElementById('modalNewBtn').onclick = () => {
            document.getElementById('resumeModal').remove();
            localStorage.removeItem('tetEnglishAutoResume');
            document.getElementById('candidateNameInput').value = '';
        };
    }
    
    function checkForAutoResume() {
        const saved = localStorage.getItem('tetEnglishAutoResume');
        if (saved) {
            try {
                const state = JSON.parse(saved);
                if (state && !state.isSubmitted && state.candidateName && state.candidateName.trim() !== "") {
                    document.getElementById('candidateNameInput').value = state.candidateName;
                    if (state.language) currentLanguage = state.language;
                    updateUILanguage();
                    showResumePopup(state);
                    return true;
                } else {
                    localStorage.removeItem('tetEnglishAutoResume');
                }
            } catch(e) { localStorage.removeItem('tetEnglishAutoResume'); }
        }
        return false;
    }
    
    function autoResumeExam(state) {
        candidateName = state.candidateName;
        userAnswers = state.userAnswers;
        currentIndex = state.currentIndex;
        timeLeft = state.timeLeft;
        startTimestamp = state.startTimestamp;
        quizActive = true;
        isSubmitted = false;
        if (state.language) currentLanguage = state.language;
        updateUILanguage();
        
        document.getElementById('quizCandidateName').innerText = candidateName;
        const m = Math.floor(timeLeft/60);
        const s = timeLeft%60;
        document.getElementById('timerDisplay').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        renderQuestion();
        startTimer();
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('quizContainer').style.display = 'block';
        document.getElementById('resultContainer').style.display = 'none';
    }
    
    function clearAllAndRestart() {
        localStorage.removeItem('tetEnglishAutoResume');
        document.getElementById('resultContainer').style.display = 'none';
        document.getElementById('startScreen').style.display = 'flex';
        document.getElementById('quizContainer').style.display = 'none';
        document.getElementById('candidateNameInput').value = '';
        if(timerInterval) clearInterval(timerInterval);
        quizActive = false;
    }
    
    let userAnswers = new Array(QUESTIONS.length).fill(null);
    let currentIndex = 0;
    let timeLeft = (parseInt(dashboard.duration) || 15) * 60;
    let timerInterval = null;
    let quizActive = false;
    let startTimestamp = null;
    let candidateName = "";
    let isSubmitted = false;
    
    function getCurrentQuestionText(q) { 
        let raw = currentLanguage === 'en' ? q.en : q.ta;
        return raw;
    }
    
    function getCurrentOptions(q) { 
        return currentLanguage === 'en' ? q.optionsEn : q.optionsTa; 
    }
    
    function renderQuestion() {
        if (QUESTIONS.length === 0) { 
            document.getElementById('questionArea').innerHTML = '<div class="empty-message">⚠️ No questions loaded.</div>'; 
            return; 
        }
        const q = QUESTIONS[currentIndex];
        const txt = getCurrentQuestionText(q);
        const optsArray = getCurrentOptions(q);
        const sel = userAnswers[currentIndex];
        
        let imageHtml = '';
        if (q.imageUrl && q.imageUrl.trim() !== '') {
            imageHtml = `<img class="question-image" src="${escapeHtml(q.imageUrl)}" alt="Question image" loading="lazy">`;
        }
        
        let optsHtml = '';
        optsArray.forEach((opt, i) => { 
            optsHtml += `<div class="option-item ${sel===i ? 'selected' : ''}" onclick="selectOption(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(opt)}</div>`; 
        });
        
        document.getElementById('questionArea').innerHTML = `
            ${imageHtml}
            <div class="question-text">${currentIndex+1}. ${txt}</div>
            <div>${optsHtml}</div>
        `;
        updateNavButtons(); 
        updatePalette(); 
        if(window.MathJax) MathJax.typesetPromise();
    }
    
    function selectOption(optIndex) {
        if(isSubmitted) return;
        if(userAnswers[currentIndex] === optIndex) return;
        userAnswers[currentIndex] = optIndex;
        renderQuestion();
        updatePalette();
        autoSaveState();
    }
    
    function updateNavButtons() {
        if (QUESTIONS.length === 0) { document.getElementById('navButtons').innerHTML = ''; return; }
        const t = translations[currentLanguage];
        let html = `<button class="btn btn-secondary" onclick="prevQuestion()">${t.prevBtn}</button>`;
        if(currentIndex === QUESTIONS.length-1) html += `<button class="btn btn-danger" onclick="submitQuiz()">${t.submitBtn}</button>`;
        else html += `<button class="btn" onclick="nextQuestion()">${t.nextBtn}</button>`;
        document.getElementById('navButtons').innerHTML = html;
    }
    
    function prevQuestion() { if(!isSubmitted && currentIndex>0) { currentIndex--; renderQuestion(); autoSaveState(); } }
    function nextQuestion() { if(!isSubmitted && currentIndex<QUESTIONS.length-1) { currentIndex++; renderQuestion(); autoSaveState(); } }
    
    function updatePalette() {
        const ps = document.getElementById('paletteScroll');
        if(!ps) return;
        ps.innerHTML = '';
        if (QUESTIONS.length === 0) return;
        for(let i=0; i<QUESTIONS.length; i++) {
            const btn = document.createElement('button');
            btn.innerText = i+1; btn.classList.add('q-palette');
            if(userAnswers[i] !== null) btn.classList.add('answered');
            if(i === currentIndex) btn.classList.add('current');
            btn.onclick = (function(idx) { return function() { if(!isSubmitted) { currentIndex = idx; renderQuestion(); updatePalette(); autoSaveState(); } }; })(i);
            ps.appendChild(btn);
        }
    }
    
    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!quizActive || isSubmitted) return;
            if(timeLeft <= 0) { 
                clearInterval(timerInterval); 
                if(!isSubmitted) submitQuiz(); 
            } else { 
                timeLeft--; 
                const m = Math.floor(timeLeft/60), s = timeLeft%60; 
                document.getElementById('timerDisplay').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; 
                if(timeLeft % 10 === 0) autoSaveState();
                if(timeLeft===0) submitQuiz(); 
            }
        }, 1000);
    }
    
    function buildDetailedReview() {
        let html = '';
        for(let i=0; i<QUESTIONS.length; i++) {
            const q = QUESTIONS[i];
            const u = userAnswers[i];
            const corr = q.answer;
            const isCorr = (u !== null && u === corr);
            const txt = getCurrentQuestionText(q);
            const optsArray = getCurrentOptions(q);
            
            let imageHtml = '';
            if (q.imageUrl && q.imageUrl.trim() !== '') {
                imageHtml = `<img class="review-question-img" src="${escapeHtml(q.imageUrl)}" alt="Question image" loading="lazy"><br>`;
            }
            
            let optsHtml = '';
            optsArray.forEach((_, idx) => {
                let marker = '';
                if(idx === corr) marker = ' ✅ (Correct)';
                if(u === idx && idx !== corr) marker = ' ❌ (Your choice)';
                else if(u === idx && idx === corr) marker = ' ✅ (Correct)';
                const styleClass = (idx === corr) ? 'correct-option' : '';
                const userWrongStyle = (u === idx && idx !== corr) ? 'color:#ef4444;' : '';
                optsHtml += `<div class="${styleClass}" style="${userWrongStyle}">${String.fromCharCode(65+idx)}. ${escapeHtml(optsArray[idx])}${marker}</div>`;
            });
            const userAns = (u !== null) ? `${String.fromCharCode(65+u)}. ${escapeHtml(optsArray[u])}` : "Not answered";
            html += `<div class="review-card" style="border-left-color:${isCorr?'#10b981':'#ef4444'}">
                        <strong>Q${i+1}. ${txt}</strong>
                        ${imageHtml}
                        <div><strong>Your answer:</strong> ${userAns}</div>
                        <div><strong>Options:</strong></div>
                        <div>${optsHtml}</div>
                        <div><strong>Correct:</strong> ${String.fromCharCode(65+corr)}. ${escapeHtml(optsArray[corr])}</div>
                    </div>`;
        }
        document.getElementById('reviewList').innerHTML = html;
        if(window.MathJax) MathJax.typesetPromise();
    }
    
    async function sendToGoogleSheet(correct, incorrect, na, timeStr) {
        if (!GOOGLE_SHEET_URL) return;
        try {
            await fetch(GOOGLE_SHEET_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    "Candidate Name": candidateName, 
                    "Subject": dashboard.subject, 
                    "Topic Name": dashboard.topic, 
                    "Total": QUESTIONS.length, 
                    "Correct": correct, 
                    "Incorrect": incorrect, 
                    "Not Attempted": na, 
                    "Accuracy (%)": ((correct/QUESTIONS.length)*100).toFixed(1), 
                    "Time Taken": timeStr, 
                    "Timestamp": new Date().toISOString() 
                }) 
            });
        } catch(err) { console.error(err); }
    }
    
    function submitQuiz() {
        if(isSubmitted) return;
        isSubmitted = true; quizActive = false; clearInterval(timerInterval);
        localStorage.removeItem('tetEnglishAutoResume');
        let correct=0, incorrect=0, na=0;
        for(let i=0; i<QUESTIONS.length; i++) { 
            if(userAnswers[i] === null) na++; 
            else if(userAnswers[i] === QUESTIONS[i].answer) correct++; 
            else incorrect++; 
        }
        const acc = (QUESTIONS.length===0)?0:(correct/QUESTIONS.length)*100;
        const takenSec = startTimestamp ? Math.floor((Date.now()-startTimestamp)/1000) : ((parseInt(dashboard.duration)||15)*60 - timeLeft);
        const mins = Math.floor(takenSec/60), secs = takenSec%60, timeStr = `${mins}:${secs.toString().padStart(2,'0')}`;
        document.getElementById('finalScore').innerText = correct;
        document.getElementById('correctCountStat').innerText = correct;
        document.getElementById('incorrectCountStat').innerText = incorrect;
        document.getElementById('notAttemptedStat').innerText = na;
        document.getElementById('accuracySpan').innerHTML = `${acc.toFixed(1)}%`;
        document.getElementById('timeTakenSpan').innerHTML = timeStr;
        document.getElementById('resultCandidateName').innerHTML = `🏆 ${escapeHtml(candidateName)}`;
        document.getElementById('resultTopicName').innerHTML = `📖 Topic: ${escapeHtml(dashboard.topic)}`;
        const pct = (QUESTIONS.length===0)?0:(correct/QUESTIONS.length)*100;
        document.getElementById('scoreRing').style.setProperty('--score-percent', `${pct}%`);
        buildDetailedReview();
        sendToGoogleSheet(correct, incorrect, na, timeStr);
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('quizContainer').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
    }
    
    function startNewExam() {
        const name = document.getElementById('candidateNameInput').value.trim();
        if(!name){ alert(translations[currentLanguage].enterName); return; }
        localStorage.removeItem('tetEnglishAutoResume');
        candidateName = name;
        userAnswers = new Array(QUESTIONS.length).fill(null);
        currentIndex = 0;
        timeLeft = (parseInt(dashboard.duration) || 15) * 60;
        startTimestamp = Date.now();
        quizActive = true;
        isSubmitted = false;
        document.getElementById('quizCandidateName').innerText = candidateName;
        renderQuestion();
        startTimer();
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('quizContainer').style.display = 'block';
        document.getElementById('resultContainer').style.display = 'none';
        autoSaveState();
    }
    
    function toggleTheme() { 
        const curr = document.documentElement.getAttribute('data-theme');
        const next = curr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('themeGreen', next);
        const darkBtn = document.getElementById('darkModeToggleBtn');
        if(darkBtn) darkBtn.innerText = next === 'dark' ? translations[currentLanguage].lightMode : translations[currentLanguage].darkMode;
    }
    
    function downloadPDFWithImages() {
        alert(translations[currentLanguage].pdfAlert);
        setTimeout(() => { window.print(); }, 100);
    }
    
    renderDashboard();
    const savedTheme = localStorage.getItem('themeGreen');
    if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.setAttribute('data-theme', 'light');
    updateUILanguage();
    checkForAutoResume();
    window.addEventListener('beforeunload', function() {
        if (quizActive && !isSubmitted) { autoSaveState(); }
    });
</script>
