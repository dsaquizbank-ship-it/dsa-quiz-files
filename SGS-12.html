    function initImageZoom() { if (typeof mediumZoom !== "undefined") { mediumZoom(".img-zoom-wrapper img, .review-question-img", { background: "rgba(0,0,0,0.9)", margin: 20 }); } }
    function renderDashboard() {
        const c = document.getElementById("dashboardContainer");
        if (c) c.innerHTML = `<div class="institute-name">DR SAHITHA IAS ACADEMY</div><div style="font-size:0.9rem;">(Since 2025)</div><div style="margin:8px 0 0; font-size:1.5rem;font-weight:800;color:var(--accent);">📖 ${escapeHtml(dashboard.examTitle)}</div><div>TEST.NO - ${escapeHtml(dashboard.testNo)}</div><div>📅 DATE: ${escapeHtml(dashboard.date)}</div><div>📖 SUBJECT: ${escapeHtml(dashboard.subject)}</div><div>🎯 TOPIC: ${escapeHtml(dashboard.topic)}</div><div>⏱️ DURATION: ${escapeHtml(dashboard.duration)} MIN</div><div>🏆 TOTAL MARKS: ${dashboard.totalMarks}</div>`;
        const ts = document.getElementById("totalQsSpan"); if (ts) ts.innerText = `/${dashboard.totalMarks}`;
    }
    function autoSaveState() { if (!quizActive || isSubmitted) return; try { localStorage.setItem("tetEnglishAutoResume", JSON.stringify({ userAnswers: userAnswers, currentIndex: currentIndex, timeLeft: timeLeft, startTimestamp: startTimestamp, isSubmitted: false, quizActive: true, savedAt: Date.now(), language: currentLanguage })); } catch(e) {} }
    function showResumePopup(savedState) {
        const answeredCount = savedState.userAnswers.filter(a => a !== null).length;
        const remaining = QUESTIONS.length - answeredCount;
        document.body.insertAdjacentHTML("beforeend", `<div id="resumeModal" class="modal-overlay"><div class="modal-container"><h3>🔄 Unfinished Exam Found</h3><p>You have an incomplete exam.<br><strong>${answeredCount}</strong> questions answered, <strong>${remaining}</strong> remaining.<br>Do you want to continue?</p><div class="modal-buttons"><button id="modalResumeBtn" class="btn">✅ Resume</button><button id="modalNewBtn" class="btn btn-secondary">❌ Start New</button></div></div></div>`);
        document.getElementById("modalResumeBtn").onclick = () => { document.getElementById("resumeModal").remove(); autoResumeExam(savedState); };
        document.getElementById("modalNewBtn").onclick = () => { document.getElementById("resumeModal").remove(); try { localStorage.removeItem("tetEnglishAutoResume"); } catch(e) {} };
    }
    function checkForAutoResume() {
        let saved = null;
        try { saved = localStorage.getItem("tetEnglishAutoResume"); } catch(e) {}
        if (saved) {
            try {
                const state = JSON.parse(saved);
                if (state && !state.isSubmitted) {
                    if (state.language) currentLanguage = state.language;
                    updateUILanguage();
                    showResumePopup(state);
                    return true;
                } else try { localStorage.removeItem("tetEnglishAutoResume"); } catch(e) {}
            } catch(e) { try { localStorage.removeItem("tetEnglishAutoResume"); } catch(er) {} }
        }
        return false;
    }
    function autoResumeExam(state) {
        userAnswers = state.userAnswers;
        currentIndex = state.currentIndex;
        timeLeft = state.timeLeft;
        startTimestamp = state.startTimestamp;
        quizActive = true; isSubmitted = false;
        if (state.language) currentLanguage = state.language;
        updateUILanguage();
        const m = Math.floor(timeLeft/60), s = timeLeft%60;
        document.getElementById("timerDisplay").innerText = `${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`;
        renderQuestion(); startTimer();
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quizContainer").style.display = "block";
        document.getElementById("resultContainer").style.display = "none";
    }
    function clearAllAndRestart() {
        try { localStorage.removeItem("tetEnglishAutoResume"); } catch(e) {}
        document.getElementById("resultContainer").style.display = "none";
        document.getElementById("startScreen").style.display = "flex";
        document.getElementById("quizContainer").style.display = "none";
        if (timerInterval) clearInterval(timerInterval);
        quizActive = false; isSubmitted = false;
        if (window.history && window.history.state && window.history.state.resultPage) {
            history.back();
        }
    }
    function openNativeLeaderboard() {
        if (window.AndroidBridge && window.AndroidBridge.openLeaderboard) {
            window.AndroidBridge.openLeaderboard(dashboard.examTitle + " - " + dashboard.testNo);
        } else {
            alert("Leaderboard is only available inside the Android App.");
        }
    }
    let userAnswers = new Array(QUESTIONS.length).fill(null);
    if (typeof injectedAnswers !== "undefined" && injectedAnswers.length > 0) { userAnswers = injectedAnswers; }
    let currentIndex = 0;
    let timeLeft = (parseInt(dashboard.duration) || 15) * 60;
    let timerInterval = null;
    let quizActive = false;
    let startTimestamp = null;
    let isSubmitted = false;
    function getCurrentQuestionText(q) { return currentLanguage === "en" ? q.en : q.ta; }
    function getCurrentOptions(q) { return currentLanguage === "en" ? q.optionsEn : q.optionsTa; }
    function renderQuestion() {
        if (QUESTIONS.length === 0) {
            document.getElementById("questionArea").innerHTML = '<div class="empty-message">⚠️ No questions loaded.</div>';
            return;
        }
        const q = QUESTIONS[currentIndex];
        const txt = getCurrentQuestionText(q);
        const optsArray = getCurrentOptions(q);
        const sel = userAnswers[currentIndex];
        let displayTxt = txt;
        let extraClass = "question-text";
        let passageHtml = "";
        if (q.type === "rc") {
            let pText = currentLanguage === "en" ? (q.passageTextEN || q.passageEn || q.passage) : (q.passageTextTA || q.passageTa || q.passage);
            if (pText) passageHtml = `<div class="passage-box">${pText}</div>`;
            else displayTxt = `<div class="passage-box">${txt}</div>`;
        } else if (q.type === "puzzle") {
            displayTxt = `<div class="puzzle-box">${txt}</div>`;
            extraClass = "question-text";
        }
        let imageHtml = "";
        const urlsToLoad = [];
        if (q.imageUrls && Array.isArray(q.imageUrls)) q.imageUrls.forEach(u => urlsToLoad.push(u));
        else if (q.imageUrl && q.imageUrl.trim() !== "") urlsToLoad.push(q.imageUrl);
        urlsToLoad.forEach(url => {
            let safeUrl = getSafeImageUrl(url);
            imageHtml += `<div class="img-zoom-wrapper"><img src="${escapeHtml(safeUrl)}" alt="Question image" loading="lazy"></div>`;
        });
        let optsHtml = "";
        optsArray.forEach((opt, i) => {
            optsHtml += `<div class="option-item ${sel===i ? "selected" : ""}" onclick="selectOption(${i})">
                <span class="option-letter">${String.fromCharCode(65+i)}.</span>
                <span class="option-text">${opt}</span>
            </div>`;
        });
        document.getElementById("questionArea").innerHTML = `
            ${passageHtml}
            <div style="padding: 0 16px 20px 16px;">
                ${imageHtml}
                <div class="${extraClass}">${currentIndex+1}. ${displayTxt}</div>
                <div>${optsHtml}</div>
            </div>
        `;
        updateTopClearButton();
        updateNavButtons(); updatePalette();
        if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise().catch(function(e){console.error(e);}); }
        initImageZoom();
    }
    function updateTopClearButton() {
        const container = document.getElementById("topClearBtnContainer");
        if (!container) return;
        const sel = userAnswers[currentIndex];
        if (sel !== null && sel !== undefined) {
            container.innerHTML = `<button class="btn btn-danger" style="padding: 6px 14px; font-size: 0.8rem; min-height: auto; opacity: 0.9; border-radius: 40px;" onclick="clearSelection()">✖ Clear Selection</button>`;
        } else {
            container.innerHTML = "";
        }
    }
    function selectOption(optIndex) {
        if (isSubmitted) return;
        if (userAnswers[currentIndex] === optIndex) {
            userAnswers[currentIndex] = null;
        } else {
            userAnswers[currentIndex] = optIndex;
        }
        renderQuestion(); updatePalette(); autoSaveState();
    }

    function clearSelection() {
        if (isSubmitted) return;
        userAnswers[currentIndex] = null;
        renderQuestion(); updatePalette(); autoSaveState();
    }
    function updateNavButtons() {
        if (QUESTIONS.length === 0) { document.getElementById("navButtons").innerHTML = ""; return; }
        const t = translations[currentLanguage];
        let html = `<button class="btn btn-secondary" onclick="prevQuestion()">${t.prevBtn}</button>`;
        if (currentIndex === QUESTIONS.length-1) html += `<button class="btn btn-danger" onclick="submitQuiz()">${t.submitBtn}</button>`;
        else html += `<button class="btn" onclick="nextQuestion()">${t.nextBtn}</button>`;
        document.getElementById("navButtons").innerHTML = html;
    }
    function prevQuestion() { if (!isSubmitted && currentIndex>0) { currentIndex--; renderQuestion(); autoSaveState(); } }
    function nextQuestion() { if (!isSubmitted && currentIndex<QUESTIONS.length-1) { currentIndex++; renderQuestion(); autoSaveState(); } }
    function updatePalette() {
        const ps = document.getElementById("paletteScroll");
        if (!ps) return;
        ps.innerHTML = "";
        if (QUESTIONS.length === 0) return;
        for (let i=0; i<QUESTIONS.length; i++) {
            const btn = document.createElement("button");
            btn.innerText = i+1; btn.classList.add("q-palette");
            if (userAnswers[i] !== null) btn.classList.add("answered");
            if (i === currentIndex) btn.classList.add("current");
            btn.onclick = (function(idx) { return function() { if (!isSubmitted) { currentIndex = idx; renderQuestion(); updatePalette(); autoSaveState(); } }; })(i);
            ps.appendChild(btn);
        }
    }
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!quizActive || isSubmitted) return;
            if (timeLeft <= 0) { clearInterval(timerInterval); if (!isSubmitted) submitQuiz(); }
            else {
                timeLeft--;
                const m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById("timerDisplay").innerText = `${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`;
                if (timeLeft % 10 === 0) autoSaveState();
                if (timeLeft === 0) submitQuiz();
            }
        }, 1000);
    }
    let currentReviewIndex = 0;
    function buildDetailedReview() {
        let html = "";
        for (let i=0; i<QUESTIONS.length; i++) {
            const q = QUESTIONS[i]; const u = userAnswers[i]; const corr = q.answer;
            const isCorr = (u !== null && u !== undefined && u === corr);
            const txt = getCurrentQuestionText(q) || "";
            const optsArray = getCurrentOptions(q) || [];
            let optsHtml = "";
            optsArray.forEach((_, idx) => {
                let cssClass = "option-item";
                let markerHtml = "";
                if (idx === corr) { cssClass += " correct"; markerHtml = "<div class='marker'>✔</div>"; }
                else if (u === idx && idx !== corr) { cssClass += " wrong"; markerHtml = "<div class='marker'>✖</div>"; }
                optsHtml += `<div class="${cssClass}"><span>${String.fromCharCode(65+idx)}. ${optsArray[idx]}</span>${markerHtml}</div>`;
            });
            let passageHtml = "";
            if (q.type === "rc") {
                let pText = currentLanguage === "en" ? (q.passageTextEN || q.passageEn || q.passage) : (q.passageTextTA || q.passageTa || q.passage);
                if (pText) passageHtml = `<div class="passage-box">${pText}</div>`;
            } else if (q.type === "puzzle") {
                passageHtml = `<div class="puzzle-box">${txt}</div>`;
            }
            let imgHtml = "";
            const urlsToLoad = [];
            if (q.imageUrls && Array.isArray(q.imageUrls)) q.imageUrls.forEach(u => urlsToLoad.push(u));
            else if (q.imageUrl && String(q.imageUrl).trim() !== "") urlsToLoad.push(q.imageUrl);
            urlsToLoad.forEach(url => {
                let safeUrl = getSafeImageUrl(url);
                imgHtml += `<img class="review-question-img" src="${escapeHtml(safeUrl)}" alt="Q${i+1} image" loading="eager">`;
            });
            const userAns = (u !== null && u !== undefined && u !== -1) ? `${String.fromCharCode(65+u)}. ${optsArray[u]}` : "Not answered";
            html += `<div class="review-card" id="review-card-${i}" style="display: none;">
                        <div class="question-text" style="font-weight:bold; font-size:16px; margin-bottom:8px; word-wrap: break-word; overflow-wrap: break-word;">Q${i+1}. ${txt}</div>
                        ${passageHtml}
                        ${imgHtml}
                        <div class="your-answer">Your Answer: ${userAns}</div>
                        <div class="correct-answer">Correct Answer: ${String.fromCharCode(65+corr)}. ${optsArray[corr]}</div>
                        ${optsHtml}
                    </div>`;
        }
        document.getElementById("reviewList").innerHTML = html;
        if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise().catch(function(e){console.error(e);}); }
        initImageZoom();
        document.querySelectorAll("#reviewList img").forEach(img => {
            if (!img.complete) { const pre = new Image(); pre.src = img.src; }
        });
        currentReviewIndex = 0;
        showReviewCard(currentReviewIndex);
    }
    function showReviewCard(index) {
        const cards = document.querySelectorAll(".review-card");
        if (cards.length === 0) return;
        cards.forEach(c => c.style.display = "none");
        cards[index].style.display = "block";
        document.getElementById("reviewPageText").innerText = `${index + 1} / ${cards.length}`;
        document.getElementById("prevReviewBtn").disabled = (index === 0);
        document.getElementById("nextReviewBtn").disabled = (index === cards.length - 1);
        document.getElementById("reviewPagination").style.display = "flex";
        window.scrollTo(0, 0);
    }
    function navigateReview(direction) {
        const cards = document.querySelectorAll(".review-card");
        currentReviewIndex += direction;
        if (currentReviewIndex >= 0 && currentReviewIndex < cards.length) {
            showReviewCard(currentReviewIndex);
        }
    }
    async function downloadPdfWithAssets(btn) {
        const originalText = btn ? btn.innerText : "📄 Download PDF";
        if (btn) { btn.disabled = true; btn.innerText = "⏳ Preparing..."; }
        try {
            if (window.MathJax && MathJax.typesetPromise) { try { await MathJax.typesetPromise(); } catch(e) {} }
            document.querySelectorAll(".review-card").forEach(c => c.style.display = "block");
            document.getElementById("reviewPagination").style.display = "none";
            await new Promise(r => setTimeout(r, 600));
            if (window.AndroidBridge && window.AndroidBridge.printPage) {
                window.AndroidBridge.printPage();
                if (btn) btn.innerText = "✅ Select Save as PDF";
            } else {
                window.print();
            }
        } catch (e) {
            console.error("PDF export failed:", e);
        } finally {
            setTimeout(() => { 
                if (btn) { btn.disabled = false; btn.innerText = originalText; }
                showReviewCard(currentReviewIndex);
            }, 3000);
        }
    }
    async function sendToGoogleSheet(correct, incorrect, na, timeStr, finalScore) {
        if (!GOOGLE_SHEET_URL) return;
        const studentName = window.actualStudentName || "Student";
        try {
            await fetch(GOOGLE_SHEET_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "Candidate Name": studentName,
                    "Test No": dashboard.testNo,
                    "Subject": dashboard.subject,
                    "Topic Name": dashboard.topic,
                    "Total Questions": QUESTIONS.length,
                    "Correct Answers": correct,
                    "Incorrect Answers": incorrect,
                    "Final Score (after negative marking)": finalScore,
                    "Accuracy (%)": ((correct/QUESTIONS.length)*100).toFixed(1),
                    "Time Taken": timeStr
                })
            });
        } catch(err) { console.error("Sheet Error:", err); }
    }
    function submitQuiz() {
        if (isSubmitted) return;
        isSubmitted = true; quizActive = false; clearInterval(timerInterval);
        try { localStorage.removeItem("tetEnglishAutoResume"); } catch(e) {}
        let correct=0, incorrect=0, na=0;
        for (let i=0; i<QUESTIONS.length; i++) {
            if (userAnswers[i] === null) na++;
            else if (userAnswers[i] === QUESTIONS[i].answer) correct++;
            else incorrect++;
        }
        const negMark = dashboard.negativeMark || 0;
        const finalScore = correct - (incorrect * negMark);
        try {
            if (window.AndroidBridge && window.AndroidBridge.submitScore) {
                window.AndroidBridge.submitScore(JSON.stringify({
                    testId: dashboard.testNo || "",
                    testName: dashboard.examTitle + " - " + dashboard.testNo,
                    correct: correct, wrong: incorrect, skipped: na,
                    total: QUESTIONS.length, score: finalScore,
                    stayOnScreen: true, answers: userAnswers, questions: QUESTIONS
                }));
            }
        } catch (e) { console.log("Bridge error", e); }
        const acc = (QUESTIONS.length===0)?0:(correct/QUESTIONS.length)*100;
        const takenSec = startTimestamp ? Math.floor((Date.now()-startTimestamp)/1000) : ((parseInt(dashboard.duration)||15)*60 - timeLeft);
        const mins = Math.floor(takenSec/60), secs = takenSec%60, timeStr = `${mins}:${secs.toString().padStart(2,"0")}`;
        document.getElementById("finalScore").innerText = finalScore;
        document.getElementById("correctCountStat").innerText = correct;
        document.getElementById("incorrectCountStat").innerText = incorrect;
        document.getElementById("notAttemptedStat").innerText = na;
        document.getElementById("accuracySpan").innerHTML = `${acc.toFixed(1)}%`;
        document.getElementById("timeTakenSpan").innerHTML = timeStr;
        document.getElementById("resultTopicName").innerHTML = `📖 Topic: ${dashboard.topic}`;
        const pct = (QUESTIONS.length===0)?0:(finalScore/QUESTIONS.length)*100;
        document.getElementById("scoreRing").style.setProperty("--score-percent", `${pct}%`);
        buildDetailedReview();
        sendToGoogleSheet(correct, incorrect, na, timeStr, finalScore);
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("resultContainer").style.display = "block";
        history.replaceState({ resultPage: true }, "", "#result");
    }
    function startNewExam() {
        try { localStorage.removeItem("tetEnglishAutoResume"); } catch(e) {}
        userAnswers = new Array(QUESTIONS.length).fill(null);
        currentIndex = 0;
        timeLeft = (parseInt(dashboard.duration) || 15) * 60;
        startTimestamp = Date.now();
        quizActive = true; isSubmitted = false;
        let candidateName = window.actualStudentName;
        if (!candidateName || candidateName === "Student" || candidateName === "Candidate") {
            candidateName = prompt("Please enter your name to start the exam:", "");
            if (!candidateName) return;
            window.actualStudentName = candidateName;
        }
        document.getElementById("quizCandidateName").innerText = candidateName;
        renderQuestion(); startTimer();
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quizContainer").style.display = "block";
        document.getElementById("resultContainer").style.display = "none";
        autoSaveState();
    }
    renderDashboard();
    document.documentElement.setAttribute("data-theme", "dark");
    updateUILanguage();
    checkForAutoResume();
    window.addEventListener("popstate", function(e) {
        if (isSubmitted && document.getElementById("resultContainer").style.display === "block") {
            history.pushState({ resultPage: true }, "", "#result");
            confirmLeaveResult();
        }
    });
    function confirmLeaveResult() {
        if (window.AndroidBridge && window.AndroidBridge.exitResultPage) {
            window.AndroidBridge.exitResultPage();
        } else {
            history.back();
        }
    }
    window.checkForReview = function() {
        if (typeof injectedAnswers !== "undefined" && Array.isArray(injectedAnswers)) {
            userAnswers = injectedAnswers;
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("review") === "true") {
                let savedAnswers = null; try { savedAnswers = localStorage.getItem("reviewAnswers"); } catch(e) {}
                if (savedAnswers) {
                    try { userAnswers = JSON.parse(savedAnswers); } catch(e) {}
                }
            }
        }
        try { localStorage.removeItem("reviewAnswers"); } catch(e) {}
        isSubmitted = true; quizActive = false;
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("resultContainer").style.display = "block";
        let correct=0, incorrect=0, na=0;
        for (let i=0; i<QUESTIONS.length; i++) {
            if (userAnswers[i] === null || userAnswers[i] === undefined || userAnswers[i] === -1) na++;
            else if (userAnswers[i] === QUESTIONS[i].answer) correct++;
            else incorrect++;
        }
        const negMark = dashboard.negativeMark || 0;
        const finalScore = correct - (incorrect * negMark);
        const acc = (QUESTIONS.length===0)?0:(correct/QUESTIONS.length)*100;
        document.getElementById("finalScore").innerText = finalScore;
        document.getElementById("correctCountStat").innerText = correct;
        document.getElementById("incorrectCountStat").innerText = incorrect;
        document.getElementById("notAttemptedStat").innerText = na;
        document.getElementById("accuracySpan").innerHTML = acc.toFixed(1) + "%";
        document.getElementById("resultTopicName").innerHTML = "📖 Topic: " + dashboard.topic;
        const pct = (QUESTIONS.length===0)?0:(finalScore/QUESTIONS.length)*100;
        document.getElementById("scoreRing").style.setProperty("--score-percent", pct + "%");
        buildDetailedReview();
    };
    window.addEventListener("beforeunload", function() { if (quizActive && !isSubmitted) autoSaveState(); });
</script>
</body>
</html>
