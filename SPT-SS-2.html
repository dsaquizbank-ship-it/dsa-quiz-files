                        ${passageHtml}
                        ${imgHtml}
                        <div class="your-answer">Your Answer: ${userAns}</div>
                        <div class="correct-answer">Correct Answer: ${String.fromCharCode(65+corr)}. ${optsArray[corr]}</div>
                        ${optsHtml}
                    </div>`;
        }
        document.getElementById("reviewList").innerHTML = html;
        if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise().catch(function(e){console.error(e);}); }
        initImageZoom();
        document.querySelectorAll("#reviewList img").forEach(img => {
            if (!img.complete) { const pre = new Image(); pre.src = img.src; }
        });
        currentReviewIndex = 0;
        showReviewCard(currentReviewIndex);
    }
    function showReviewCard(index) {
        const cards = document.querySelectorAll(".review-card");
        if (cards.length === 0) return;
        cards.forEach(c => c.style.display = "none");
        cards[index].style.display = "block";
        document.getElementById("reviewPageText").innerText = `${index + 1} / ${cards.length}`;
        document.getElementById("prevReviewBtn").disabled = (index === 0);
        document.getElementById("nextReviewBtn").disabled = (index === cards.length - 1);
        document.getElementById("reviewPagination").style.display = "flex";
        window.scrollTo(0, 0);
    }
    function navigateReview(direction) {
        const cards = document.querySelectorAll(".review-card");
        currentReviewIndex += direction;
        if (currentReviewIndex >= 0 && currentReviewIndex < cards.length) {
            showReviewCard(currentReviewIndex);
        }
    }
    async function downloadPdfWithAssets(btn) {
        const originalText = btn ? btn.innerText : "📄 Download PDF";
        if (btn) { btn.disabled = true; btn.innerText = "⏳ Preparing..."; }
        try {
            if (window.MathJax && MathJax.typesetPromise) { try { await MathJax.typesetPromise(); } catch(e) {} }
            document.querySelectorAll(".review-card").forEach(c => c.style.display = "block");
            document.getElementById("reviewPagination").style.display = "none";
            await new Promise(r => setTimeout(r, 600));
            if (window.AndroidBridge && window.AndroidBridge.printPage) {
                window.AndroidBridge.printPage();
                if (btn) btn.innerText = "✅ Select Save as PDF";
            } else {
                window.print();
            }
        } catch (e) {
            console.error("PDF export failed:", e);
        } finally {
            setTimeout(() => { 
                if (btn) { btn.disabled = false; btn.innerText = originalText; }
                showReviewCard(currentReviewIndex);
            }, 3000);
        }
    }
    async function sendToGoogleSheet(correct, incorrect, na, timeStr, finalScore) {
        if (!GOOGLE_SHEET_URL) return;
        const studentName = window.actualStudentName || "Student";
        try {
            await fetch(GOOGLE_SHEET_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "Candidate Name": studentName,
                    "Test No": dashboard.testNo,
                    "Subject": dashboard.subject,
                    "Topic Name": dashboard.topic,
                    "Total Questions": QUESTIONS.length,
                    "Correct Answers": correct,
                    "Incorrect Answers": incorrect,
                    "Final Score (after negative marking)": finalScore,
                    "Accuracy (%)": ((correct/QUESTIONS.length)*100).toFixed(1),
                    "Time Taken": timeStr
                })
            });
        } catch(err) { console.error("Sheet Error:", err); }
    }
    function submitQuiz() {
        if (isSubmitted) return;
        isSubmitted = true; quizActive = false; clearInterval(timerInterval);
        try { localStorage.removeItem("tetEnglishAutoResume"); } catch(e) {}
        let correct=0, incorrect=0, na=0;
        for (let i=0; i<QUESTIONS.length; i++) {
            if (userAnswers[i] === null) na++;
            else if (userAnswers[i] === QUESTIONS[i].answer) correct++;
            else incorrect++;
        }
        const negMark = dashboard.negativeMark || 0;
        const finalScore = correct - (incorrect * negMark);
        try {
            if (window.AndroidBridge && window.AndroidBridge.submitScore) {
                window.AndroidBridge.submitScore(JSON.stringify({
                    testId: dashboard.testNo || "",
                    testName: dashboard.examTitle + " - " + dashboard.testNo,
                    correct: correct, wrong: incorrect, skipped: na,
                    total: QUESTIONS.length, score: finalScore,
                    stayOnScreen: true, answers: userAnswers, questions: QUESTIONS
                }));
            }
        } catch (e) { console.log("Bridge error", e); }
        const acc = (QUESTIONS.length===0)?0:(correct/QUESTIONS.length)*100;
        const takenSec = startTimestamp ? Math.floor((Date.now()-startTimestamp)/1000) : ((parseInt(dashboard.duration)||15)*60 - timeLeft);
        const mins = Math.floor(takenSec/60), secs = takenSec%60, timeStr = `${mins}:${secs.toString().padStart(2,"0")}`;
        document.getElementById("finalScore").innerText = finalScore;
        document.getElementById("correctCountStat").innerText = correct;
        document.getElementById("incorrectCountStat").innerText = incorrect;
        document.getElementById("notAttemptedStat").innerText = na;
        document.getElementById("accuracySpan").innerHTML = `${acc.toFixed(1)}%`;
        document.getElementById("timeTakenSpan").innerHTML = timeStr;
        document.getElementById("resultTopicName").innerHTML = `📖 Topic: ${dashboard.topic}`;
        const pct = (QUESTIONS.length===0)?0:(finalScore/QUESTIONS.length)*100;
        document.getElementById("scoreRing").style.setProperty("--score-percent", `${pct}%`);
        buildDetailedReview();
        sendToGoogleSheet(correct, incorrect, na, timeStr, finalScore);
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("resultContainer").style.display = "block";
        history.replaceState({ resultPage: true }, "", "#result");
    }
    function startNewExam() {
        try { localStorage.removeItem("tetEnglishAutoResume"); } catch(e) {}
        userAnswers = new Array(QUESTIONS.length).fill(null);
        currentIndex = 0;
        timeLeft = (parseInt(dashboard.duration) || 15) * 60;
        startTimestamp = Date.now();
        quizActive = true; isSubmitted = false;
        let candidateName = window.actualStudentName;
        if (!candidateName || candidateName === "Student" || candidateName === "Candidate") {
            candidateName = prompt("Please enter your name to start the exam:", "");
            if (!candidateName) return;
            window.actualStudentName = candidateName;
        }
        document.getElementById("quizCandidateName").innerText = candidateName;
        renderQuestion(); startTimer();
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quizContainer").style.display = "block";
        document.getElementById("resultContainer").style.display = "none";
        autoSaveState();
    }
    renderDashboard();
    document.documentElement.setAttribute("data-theme", "dark");
    updateUILanguage();
    checkForAutoResume();
    window.addEventListener("popstate", function(e) {
        if (isSubmitted && document.getElementById("resultContainer").style.display === "block") {
            history.pushState({ resultPage: true }, "", "#result");
            confirmLeaveResult();
        }
    });
    function confirmLeaveResult() {
        if (window.AndroidBridge && window.AndroidBridge.exitResultPage) {
            window.AndroidBridge.exitResultPage();
        } else {
            history.back();
        }
    }
    window.checkForReview = function() {
        if (typeof injectedAnswers !== "undefined" && Array.isArray(injectedAnswers)) {
            userAnswers = injectedAnswers;
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("review") === "true") {
                let savedAnswers = null; try { savedAnswers = localStorage.getItem("reviewAnswers"); } catch(e) {}
                if (savedAnswers) {
                    try { userAnswers = JSON.parse(savedAnswers); } catch(e) {}
                }
            }
        }
        try { localStorage.removeItem("reviewAnswers"); } catch(e) {}
        isSubmitted = true; quizActive = false;
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("resultContainer").style.display = "block";
        let correct=0, incorrect=0, na=0;
        for (let i=0; i<QUESTIONS.length; i++) {
            if (userAnswers[i] === null || userAnswers[i] === undefined || userAnswers[i] === -1) na++;
            else if (userAnswers[i] === QUESTIONS[i].answer) correct++;
            else incorrect++;
        }
        const negMark = dashboard.negativeMark || 0;
        const finalScore = correct - (incorrect * negMark);
        const acc = (QUESTIONS.length===0)?0:(correct/QUESTIONS.length)*100;
        document.getElementById("finalScore").innerText = finalScore;
        document.getElementById("correctCountStat").innerText = correct;
        document.getElementById("incorrectCountStat").innerText = incorrect;
        document.getElementById("notAttemptedStat").innerText = na;
        document.getElementById("accuracySpan").innerHTML = acc.toFixed(1) + "%";
        document.getElementById("resultTopicName").innerHTML = "📖 Topic: " + dashboard.topic;
        const pct = (QUESTIONS.length===0)?0:(finalScore/QUESTIONS.length)*100;
        document.getElementById("scoreRing").style.setProperty("--score-percent", pct + "%");
        buildDetailedReview();
    };
    window.addEventListener("beforeunload", function() { if (quizActive && !isSubmitted) autoSaveState(); });
</script>
</body>
</html>
