// Get tests by date range (format: "DD/MM/YYYY")
function getTestsByDateRange(startDate, endDate) {
  const parse = d => { const [dd, mm, yyyy] = d.split('/'); return new Date(yyyy, mm-1, dd); };
  const start = parse(startDate), end = parse(endDate);
  return SCHEDULE.filter(t => {
    const d = parse(t.date);
    return d >= start && d <= end;
  });
}

// Get tests by unit
function getTestsByUnit(unit) {
  return SCHEDULE.filter(t => t.unit === unit);
}

// Get test by test number
function getTestByNo(testNo) {
  return SCHEDULE.find(t => t.testNo === testNo) || null;
}

// Get today's test (if any)
function getTodaysTest() {
  const today = new Date();
  const dd = String(today.getDate()).padStart(2, '0');
  const mm = String(today.getMonth()+1).padStart(2, '0');
  const yyyy = today.getFullYear();
  const todayStr = `${dd}/${mm}/${yyyy}`;
  return SCHEDULE.filter(t => t.date === todayStr);
}

// Get next upcoming test
function getNextTest() {
  const today = new Date();
  return SCHEDULE.find(t => {
    const [dd, mm, yyyy] = t.date.split('/');
    return new Date(yyyy, mm-1, dd) >= today;
  }) || null;
}

// Group schedule by unit
function groupByUnit() {
  const grouped = {};
  SCHEDULE.forEach(t => {
    if (!grouped[t.unit]) grouped[t.unit] = [];
    grouped[t.unit].push(t);
  });
  return grouped;
}

// Format date for display: "02/11/2026" -> "02 Nov 2026 (Monday)"
function formatDate(dateStr, day) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [dd, mm, yyyy] = dateStr.split('/');
  return `${dd} ${months[parseInt(mm)-1]} ${yyyy} (${day})`;
}

function renderSchedule() {
  const container = document.getElementById('scheduleContainer');
  if (!container) return;

  const grouped = groupByUnit();
  let html = '';

  // Header
  html += `<div style="text-align:center; margin-bottom:20px;">
    <div style="font-size:1.5rem; font-weight:800; color:var(--accent);">${SCHEDULE_META.institute}</div>
    <div style="font-size:1.2rem; font-weight:700; margin-top:4px;">${SCHEDULE_META.examTitle}</div>
    <div style="font-size:1rem; color:var(--text-primary); opacity:0.8;">${SCHEDULE_META.month} | Total: ${SCHEDULE_META.totalTests}</div>
    <div style="font-size:0.8rem; opacity:0.6;">📞 ${SCHEDULE_META.phone} | 📍 ${SCHEDULE_META.location}</div>
  </div>`;

  // All tests in order
  html += `<div style="margin-top:20px;">`;
  SCHEDULE.forEach(t => {
    const unitInfo = UNIT_NAMES[t.unit] || { color: "#888" };
    html += `<div style="background:var(--card-bg); border-left:4px solid ${unitInfo.color}; border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,0.05);">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
        <div style="font-weight:800; font-size:1.1rem; color:${unitInfo.color};">TEST ${t.testNo}</div>
        <div style="font-size:0.85rem; font-weight:600;">${formatDate(t.date, t.day)}</div>
        <span style="background:${unitInfo.color}; color:white; padding:3px 10px; border-radius:20px; font-size:0.75rem; font-weight:700;">${t.unit}</span>
      </div>
      <div style="margin-top:6px; font-size:0.9rem;">${t.topic}</div>
      <div style="margin-top:4px; font-size:0.85rem; opacity:0.8; font-style:italic;">${t.topicTa}</div>
    </div>`;
  });
  html += `</div>`;

  container.innerHTML = html;
}

                        allDates.push({ date: d.date, weekday: d.weekday });
                    }
                });
            });
            allDates.forEach((d, index) => {
                const btn = document.createElement("button");
                btn.className = "date-btn" + (index === 0 ? " active" : "");
                let dateParts = d.date.split("/"); 
                let shortDate = dateParts[0] + "/" + dateParts[1];
                btn.innerHTML = `<span class="day">${shortDate}</span><span class="weekday">${d.weekday}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll(".date-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    renderScheduleForDate(d.date);
                };
                dateSelector.appendChild(btn);
            });
            function renderScheduleForDate(targetDate) {
                container.innerHTML = "";
                let hasExams = false;
                SCHEDULE.forEach(exam => {
                    const dateMatch = exam.dates.find(d => d.date === targetDate);
                    if (dateMatch) {
                        hasExams = true;
                        const examDiv = document.createElement("div");
                        examDiv.className = "card";
                        let html = `<div class="exam-title">${exam.examName}</div>`;
                        dateMatch.entries.forEach(e => {
                            html += `<div class="test-item">
                                <div class="subject">${e.subject}</div>
                                <div class="topic">${e.topic}</div>
                                <div class="test-no">Test ID: ${e.testNo}</div>
                            </div>`;
                        });
                        examDiv.innerHTML = html;
                        container.appendChild(examDiv);
                    }
                });
                if (!hasExams) {
                    container.innerHTML = `<div class="empty-state">No tests scheduled for this date.</div>`;
                }
            }
            if (allDates.length > 0) {
                renderScheduleForDate(allDates[0].date);
            }
