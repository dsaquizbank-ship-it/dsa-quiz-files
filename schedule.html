<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test Schedule</title>
    <style>
        body { font-family: "Segoe UI", system-ui, sans-serif; background: #0D1B2A; color: #FFF; padding: 16px; }
        h2 { color: #F5B700; text-align: center; margin-bottom: 20px; }
        .date-selector-wrapper { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: thin; }
        .date-selector-wrapper::-webkit-scrollbar { height: 6px; }
        .date-selector-wrapper::-webkit-scrollbar-thumb { background: #2E4374; border-radius: 4px; }
        .date-btn { background: #1A2A5E; border: 2px solid #2E4374; color: #A8C8E1; padding: 10px 16px; border-radius: 10px; cursor: pointer; text-align: center; min-width: 100px; flex-shrink: 0; transition: 0.2s; }
        .date-btn:hover { background: #2E4374; }
        .date-btn.active { background: #F5B700; border-color: #F5B700; color: #0D1B2A; }
        .date-btn .day { font-size: 18px; font-weight: bold; display: block; }
        .date-btn .weekday { font-size: 12px; opacity: 0.8; display: block; margin-top: 2px; }
        .card { background: #1A2A5E; border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #10b981; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .exam-title { color: #F5B700; font-size: 20px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #2E4374; padding-bottom: 8px; }
        .test-item { background: #0F1B3D; padding: 12px; border-radius: 8px; margin-top: 8px; border-left: 3px solid #3b82f6; }
        .subject { color: #34d399; font-weight: bold; font-size: 14px; }
        .topic { font-size: 15px; margin-top: 4px; color: #e2e8f0; }
        .test-no { display: inline-block; background: #10b981; color: white; padding: 3px 10px; border-radius: 4px; font-size: 12px; margin-top: 8px; font-weight: bold; }
        .empty-state { text-align: center; color: #A8C8E1; font-style: italic; padding: 20px; }
        .refresh-btn { display: block; margin: 0 auto 16px; background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .loading { text-align: center; padding: 40px; color: #A8C8E1; }
    </style>
</head>
<body>
    <h2>📅 Mock Test Schedule</h2>
    
    <button class="refresh-btn" onclick="loadSchedule()">🔄 Refresh</button>
    
    <div class="date-selector-wrapper" id="dateSelector"></div>
    <div id="scheduleContainer"><div class="loading">Loading…</div></div>

    <script>
        // This URL points to the file your Admin Panel creates
        const SCHEDULE_JSON_URL = 'https://dsaquizbank-ship-it.github.io/dsa-quiz-files/schedule.json';

        const dateSelector = document.getElementById("dateSelector");
        const container = document.getElementById("scheduleContainer");
        let ALL_ENTRIES = [];

        async function loadSchedule() {
            container.innerHTML = '<div class="loading">Loading…</div>';
            try {
                // Fetch the JSON, adding a timestamp so the browser doesn't cache it
                const res = await fetch(SCHEDULE_JSON_URL + '?v=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                ALL_ENTRIES = Array.isArray(data.entries) ? data.entries : [];
                renderDateSelector();
            } catch (e) {
                container.innerHTML = '<div class="empty-state">⚠️ Could not load schedule.<br><small style="opacity:.7">' + e.message + '</small></div>';
            }
        }

        function groupByDate(entries) {
            const map = {};
            entries.forEach(e => {
                if (!map[e.date]) map[e.date] = [];
                map[e.date].push(e);
            });
            // Sort dates chronologically
            return Object.keys(map).sort().map(date => ({
                date,
                weekday: new Date(date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' }),
                entries: map[date]
            }));
        }

        function renderDateSelector() {
            const grouped = groupByDate(ALL_ENTRIES);
            dateSelector.innerHTML = '';
            if (grouped.length === 0) {
                container.innerHTML = '<div class="empty-state">No exams scheduled yet.</div>';
                return;
            }
            grouped.forEach((g, index) => {
                const btn = document.createElement('button');
                btn.className = 'date-btn' + (index === 0 ? ' active' : '');
                const parts = g.date.split('-'); // YYYY-MM-DD
                const shortDate = parts[2] + '/' + parts[1];
                btn.innerHTML = `<span class="day">${shortDate}</span><span class="weekday">${g.weekday}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderForDate(g);
                };
                dateSelector.appendChild(btn);
            });
            renderForDate(grouped[0]);
        }

        function renderForDate(group) {
            container.innerHTML = '';
            const byCourse = {};
            
            // Group by Course (e.g., TNPSC)
            group.entries.forEach(e => {
                if (!byCourse[e.courseId]) byCourse[e.courseId] = { courseName: e.courseName, items: [] };
                byCourse[e.courseId].items.push(e);
            });

            Object.keys(byCourse).forEach(courseId => {
                const course = byCourse[courseId];
                const card = document.createElement('div');
                card.className = 'card';
                let html = `<div class="exam-title">${escapeHtml(course.courseName)}</div>`;
                
                course.items.forEach(e => {
                    html += `<div class="test-item">
                        <div class="subject">${escapeHtml(course.courseName)}</div>
                        <div class="topic">${escapeHtml(e.topicName)}</div>
                        ${e.testId ? `<div class="test-no">Test ID: ${escapeHtml(e.testId)}</div>` : ''}
                    </div>`;
                });
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // Load immediately when the page opens
        loadSchedule();
    </script>
</body>
</html>
